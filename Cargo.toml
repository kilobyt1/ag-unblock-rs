[package]
name = "ag-unblock"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
